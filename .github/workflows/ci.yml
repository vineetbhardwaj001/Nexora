name: Nexora CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-agent-config:
    name: Validate agent configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JSON configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = Path(".agent/config/skills.json")
          if not config.exists():
              raise SystemExit(f"Missing required file: {config}")
          data = json.loads(config.read_text(encoding="utf-8"))
          assert isinstance(data.get("skills"), dict), "'skills' must be an object"
          assert data.get("autonomy") in {"ask-first", "guided", "autopilot-local"}, "Invalid autonomy mode"
          for path in [
              "AGENTS.md",
              ".agent/CORE.md",
              ".agents/skills/ux-ui-design/SKILL.md",
              ".agents/skills/backend-preserving-frontend/SKILL.md",
              ".agent/workflows/backend-preserving-frontend.md",
              ".agent/workflows/frontend-structure.md",
          ]:
              if not Path(path).is_file():
                  raise SystemExit(f"Missing required file: {path}")
          print(f"Validated {len(data['skills'])} skill entries and required instruction files.")
          PY

      - name: Check whitespace errors
        run: git diff --check "${{ github.event.before }}" "${{ github.sha }}" || git diff --check

  markdown-lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run markdownlint
        run: |
          npx --yes markdownlint-cli2 "README.md" "AGENTS.md" ".agent/**/*.md" ".agents/**/*.md" ".kilo/**/*.md" ".github/**/*.md" "docs/**/*.md"

  structural-tests:
    name: Run Nexora structural tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run structural tests
        run: python -m unittest discover -s tests -v

  npm-cli-tests:
    name: Test npm CLI installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run CLI tests
        run: npm test

      - name: Smoke-test CLI help
        run: node bin/nexora.js --help


  documentation-site-tests:
    name: Validate documentation site assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check HTML asset references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("docs")
          html_path = root / "index.html"
          html = html_path.read_text(encoding="utf-8")
          css_refs = re.findall(r'<link[^>]+href=["\']([^"\']+\.css)["\']', html)
          js_refs = re.findall(r'<script[^>]+src=["\']([^"\']+\.js)["\']', html)
          if len(css_refs) != 1 or len(js_refs) != 1:
              raise SystemExit(f"Expected one CSS and one JS reference; found CSS={css_refs}, JS={js_refs}")
          for ref in css_refs + js_refs:
              if not (root / ref).is_file():
                  raise SystemExit(f"Documentation asset is missing: docs/{ref}")
          if "<style>" in html or "<script>" in html:
              raise SystemExit("Keep CSS and JavaScript in dedicated asset files.")
          print(f"Validated CSS: {css_refs[0]} and JavaScript: {js_refs[0]}")
          PY

      - name: Check documentation JavaScript syntax
        run: node --check docs/assets/js/docs.js

      - name: Check documentation structure guide
        run: test -s docs/STRUCTURE.md
