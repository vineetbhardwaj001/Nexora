name: Publish Nexora CLI to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Test and stage package for npm review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Use current npm CLI
        run: npm install --global npm@latest

      - name: Run CLI tests
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Check that this version is not already published
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "nexora-agent-cli@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "::error::Version ${PACKAGE_VERSION} is already published. Bump package.json to a new version before staging."
            exit 1
          fi

      - name: Stage package with npm
        run: npm stage publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_1 }}
