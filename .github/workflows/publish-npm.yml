name: Publish Nexora CLI to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Test and stage package for npm review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Use current npm CLI
        run: npm install --global npm@latest

      - name: Run CLI tests
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Check first-publish and version prerequisites
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if ! npm view nexora-agent-cli version >/dev/null 2>&1; then
            echo "::error::The initial npm package does not exist yet. Publish the first version from an authenticated local npm session before using staged publishing. npm stage publish cannot create a brand-new package."
            exit 1
          fi
          if npm view "nexora-agent-cli@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "::error::Version ${PACKAGE_VERSION} is already published. Bump package.json to a new version before staging."
            exit 1
          fi

      - name: Stage package through npm Trusted Publishing
        run: npm stage publish --access public
